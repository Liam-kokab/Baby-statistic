# nginx reverse-proxy config for baby-statistic.
# Terminates TLS (Let's Encrypt/certbot) on 80/443 and proxies to the Node app,
# which runs on an internal-only port (see ecosystem.config.js PORT=3000).
#
# Install:
#   sudo mkdir -p /var/www/certbot   # required by the acme-challenge location below
#   sudo cp deploy/nginx/baby-statistic.conf /etc/nginx/sites-available/baby-statistic.conf
#   sudo ln -s /etc/nginx/sites-available/baby-statistic.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.example   # obtains cert + rewrites the 443 block below
#
# See doc/nginx.md for the full setup guide.

# Replace with your real domain before deploying.
map $host $baby_statistic_upstream {
  default http://127.0.0.1:3000;
}

server {
  listen 80;
  listen [::]:80;
  server_name your-domain.example;

  # Let certbot's ACME HTTP-01 challenge through, redirect everything else to HTTPS.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name your-domain.example;

  # Placeholder self-signed cert (ships on Debian/Ubuntu via the "ssl-cert"
  # package) so `nginx -t`/reload succeed *before* a real cert exists — nginx
  # must already be running for `certbot --nginx` to obtain one. Certbot
  # rewrites these two lines to point at the real Let's Encrypt cert once
  # issued; if `/etc/ssl/certs/ssl-cert-snakeoil.pem` doesn't exist on your
  # distro, install it with `sudo apt install ssl-cert` or generate any
  # temporary self-signed pair before the first `nginx -t`.
  ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
  ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

  # Reasonable modern TLS defaults; certbot may also inject options-ssl-nginx.conf.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 20m; # matches the raised limit on POST /api/backup/restore

  location / {
    proxy_pass $baby_statistic_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

